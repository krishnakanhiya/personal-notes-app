<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Record // Workspace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030712;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .edit-box {
      max-width: 600px;
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 25px;
    }
    h2 {
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }
    input, textarea {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-family: inherit;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-confirm {
      background: #0284c7;
      color: #fff;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="edit-box">
    <h2>EDIT RECORD</h2>
    <input type="hidden" id="editNoteId" value="{{ note['id'] }}">
    <input type="text" id="editTitle" value="{{ note['title'] }}" required>
    <textarea id="editContent" required>{{ note['content'] }}</textarea>
    <input type="url" id="editUrl" value="{{ note['url'] or '' }}" placeholder="Reference URL">
    <div class="actions">
      <a href="/notes" class="btn btn-cancel">Cancel</a>
      <button class="btn btn-confirm" id="updateBtn">Update Record</button>
    </div>
  </div>

  <script>
    document.getElementById('updateBtn').addEventListener('click', async () => {
      const id = document.getElementById('editNoteId').value;
      const title = document.getElementById('editTitle').value.trim();
      const content = document.getElementById('editContent').value.trim();
      const url = document.getElementById('editUrl').value.trim();

      if (!title || !content) {
        alert('Title and content cannot be blank.');
        return;
      }

      const res = await fetch(`/api/notes/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content, url })
      });

      if (res.ok) {
        window.location.href = '/notes';
      } else {
        alert('Failed to update note.');
      }
    });
  </script>
</body>
</html>
