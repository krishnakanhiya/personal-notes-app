<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace // Notes Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030712;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 30px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 15px;
    }
    header h1 {
      font-size: 1.6rem;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .composer {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .composer input, .composer textarea {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    .composer textarea {
      resize: vertical;
      min-height: 80px;
    }
    .composer input:focus, .composer textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-save {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-save:hover {
      background: #0ea5e9;
    }
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .note-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s;
    }
    .note-card:hover {
      border-color: #38bdf8;
    }
    .note-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 8px;
    }
    .note-content {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .note-url {
      font-size: 0.8rem;
      color: #38bdf8;
      text-decoration: none;
      margin-bottom: 12px;
      display: inline-block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid #1e293b;
      padding-top: 12px;
      margin-top: auto;
    }
    .btn-action {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-action:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .btn-delete:hover {
      border-color: #ef4444;
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>WORKSPACE NOTE HUB</h1>
      <a href="/" class="btn-action">Return to Welcome</a>
    </header>

    <div class="composer">
      <input type="text" id="noteTitle" placeholder="Note Title (e.g., Electrical Lab Viva Questions)">
      <textarea id="noteContent" placeholder="Enter note contents or checklist..."></textarea>
      <input type="url" id="noteUrl" placeholder="Relevant Reference Link (Optional)">
      <button class="btn-save" id="saveNoteBtn">Save Note</button>
    </div>

    <div class="notes-grid" id="notesGrid">
      <!-- Notes loaded via app.js -->
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
