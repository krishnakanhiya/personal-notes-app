<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Notes // Terminal Access</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #0b1528 0%, #030712 100%);
      color: #38bdf8;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .panel {
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-transform: uppercase;
      color: #f0f9ff;
      text-shadow: 0 0 10px #38bdf8;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .btn-launch {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 28px;
      border-radius: 6px;
      border: 1px solid #38bdf8;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
    }
    .btn-launch:hover {
      background: #0ea5e9;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>SYS // NOTES</h1>
    <p>Voice-assisted college workflow and intelligence manager. Encrypted local records.</p>
    <button class="btn-launch" id="enterBtn">ENTER WORKSPACE</button>
  </div>

  <script>
    document.getElementById('enterBtn').addEventListener('click', () => {
      if ('speechSynthesis' in window) {
        const speech = new SpeechSynthesisUtterance("Welcome to the workspace. Loading records.");
        speech.rate = 1.0;
        speech.pitch = 1.0;
        window.speechSynthesis.speak(speech);
      }
      setTimeout(() => {
        window.location.href = '/notes';
      }, 800);
    });
  </script>
</body>
</html>
